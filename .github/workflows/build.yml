name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Find project
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            z=$(ls arcana-age-of-ruin-*.zip | head -n1)
            unzip -q "$z"
            echo "PROJECT_DIR=arcana-age-of-ruin" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace 2>&1 | tee build.log
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
